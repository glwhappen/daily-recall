# Daily Recall 预览/测试环境（独立端口与独立数据库，验证改动后再切生产）
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  memory-dev:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: daily-recall:dev
    container_name: daily-recall-dev
    environment:
      DATABASE_URL: postgres://recall:${POSTGRES_PASSWORD:-recall}@db-dev:5432/recall
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      FEEDBACK_ENABLED: ${FEEDBACK_ENABLED:-true}
      PUBLIC_URL: ${PUBLIC_URL_DEV:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_GROUPS: ${ADMIN_GROUPS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
    ports:
      - "${APP_PORT_DEV:-4471}:3000"
    depends_on:
      db-dev:
        condition: service_healthy
    restart: unless-stopped

  db-dev:
    image: postgres:17-alpine
    container_name: daily-recall-db-dev
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      POSTGRES_DB: recall
    volumes:
      - ./data/postgres-dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_DEV:-4473}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
