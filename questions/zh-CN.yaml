# 每日回忆练习 — 中文题库
#
# 出题规范见 docs/question-guide.md，字段说明见 questions/schema.json。
# 提交新题请只改本文件（或 questions/en.yaml 的对应翻译），并确保：
#   1. id 全局唯一、使用 kebab-case、与语言无关（翻译时不改 id）
#   2. 选项必须穷举且互斥，用户不需要打字
#   3. fact 型题目必须包含一个 kind: forgot 的选项
#   4. text 里的 {日期} 占位符会被渲染成「昨天」「前天」「一周前」等

version: 1
locale: zh-CN

categories:
  - id: food
    name: 吃与喝
    note: 高频、易验证的日常事实，适合做长期记录
  - id: move
    name: 出行与场所
    note: 空间记忆，和「在哪」绑定的记忆最牢固
  - id: people
    name: 人际
    note: 社会记忆，涉及对话与情绪，遗忘最快
  - id: work
    name: 工作与屏幕
    note: 现代人一天的主要消耗，也是记忆最模糊的部分
  - id: fun
    name: 娱乐与手机
    note: 内容消费的记忆，常出现「看过但讲不出」
  - id: body
    name: 生活起居与身体
    note: 生理节律相关，用来对照睡眠与记忆的关系
  - id: mood
    name: 情绪与主观
    note: 情绪记忆偏主观，可整类关闭
  - id: anchor
    name: 锚点与时间感
    note: 不是考题，是「钩子」——用外部锚点把当天的记忆勾出来

