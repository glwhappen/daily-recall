name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # 题库校验包含在 npm test 里：坏题会让 CI 直接失败
      - name: Unit tests & question bank validation
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Static build
        run: npm run build
